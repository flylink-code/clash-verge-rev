name: Chain Release Build

on:
  push:
    tags:
      - 'chain-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload into (e.g. chain-v2.5.3.2)'
        required: true
        default: 'chain-v2.5.3.3'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: 'chain-release-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  prepare_release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve]
    outputs:
      release_id: ${{ steps.prepare.outputs.id }}
    steps:
      - name: Get or create release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api --silent "repos/${{ github.repository }}/releases/tags/${TAG}"; then
            ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .id)
            echo "Using existing release $ID for $TAG"
          else
            ID=$(gh api --method POST "repos/${{ github.repository }}/releases" \
              -f tag_name="${TAG}" \
              -f name="Clash Verge ${TAG} + Static Exit Chain Proxy" \
              -f body="Building multi-platform packages…" \
              --jq .id)
            echo "Created release $ID for $TAG"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  release:
    name: Release Build
    needs: [resolve, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust-chain'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Add Rust Target (fallback toolchain)
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Tauri build
        id: tauri
        continue-on-error: true
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tagName: ${{ needs.resolve.outputs.tag }}
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          includeUpdaterJson: false

      - name: Upload produced bundles
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            target/${TARGET}/release/bundle/nsis/*setup.exe
            target/${TARGET}/release/bundle/nsis/*setup.exe.sig
            target/${TARGET}/release/bundle/dmg/*.dmg
            target/${TARGET}/release/bundle/macos/*.app.tar.gz
            target/${TARGET}/release/bundle/macos/*.app.tar.gz.sig
            target/${TARGET}/release/bundle/deb/*.deb
            target/${TARGET}/release/bundle/rpm/*.rpm
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No bundles found for ${TARGET}"
            ls -la "target/${TARGET}/release/bundle" || true
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Attest Windows bundles
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/bundle/nsis/*setup*

      - name: Attest macOS bundles
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Attest Linux bundles
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  release-for-linux-arm:
    name: Release Build for Linux ARM
    needs: [resolve, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            arch: armhf
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust-chain'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Setup for linux
        run: |-
          cat > /tmp/sources.list << EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted

          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF

          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt update

          sudo apt install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }}

      - name: Install aarch64 tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install armv7 tools
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      - name: Add Rust Target (fallback toolchain)
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Build for Linux
        continue-on-error: true
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/
          fi
          pnpm build --target ${{ matrix.target }}
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Linux ARM bundles found"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  release-for-fixed-webview2:
    name: Release Build for Fixed WebView2
    needs: [resolve, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust-chain'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Download WebView2 Runtime
        run: |
          invoke-webrequest -uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/133.0.3065.92/Microsoft.WebView2.FixedVersionRuntime.133.0.3065.92.${{ matrix.arch }}.cab -outfile Microsoft.WebView2.FixedVersionRuntime.133.0.3065.92.${{ matrix.arch }}.cab
          Expand .\Microsoft.WebView2.FixedVersionRuntime.133.0.3065.92.${{ matrix.arch }}.cab -F:* ./src-tauri
          Remove-Item .\src-tauri\tauri.windows.conf.json
          Rename-Item .\src-tauri\webview2.${{ matrix.arch }}.json tauri.windows.conf.json

      - name: Add Rust Target (fallback toolchain)
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Tauri build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          includeUpdaterJson: false

      - name: Rename
        run: |
          $files = Get-ChildItem ".\target\${{ matrix.target }}\release\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $newName = $file.Name -replace "-setup\.exe$", "_fixed_webview2-setup.exe"
            Rename-Item $file.FullName $newName
          }

          $files = Get-ChildItem ".\target\${{ matrix.target }}\release\bundle\nsis\*-setup.exe.sig" -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $newName = $file.Name -replace "-setup\.exe\.sig$", "_fixed_webview2-setup.exe.sig"
            Rename-Item $file.FullName $newName
          }

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $files = Get-ChildItem "target\${{ matrix.target }}\release\bundle\nsis\*setup*" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if (-not $files) { throw "No fixed WebView2 bundles found" }
          gh release upload "$env:TAG" $files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish_notes:
    name: Publish download notes
    runs-on: ubuntu-latest
    needs:
      [
        resolve,
        prepare_release,
        release,
        release-for-linux-arm,
        release-for-fixed-webview2,
      ]
    if: always() && needs.prepare_release.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Write release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          BUILDTIME=$(TZ=Asia/Shanghai date)

          cat > release.txt << EOF
          ## 本版本相对官方 ${VERSION}（dev）

          基于 Clash Verge Rev **${VERSION}** 代码，增加静态出口链式代理。多平台安装包由 GitHub Actions 构建。

          - 首页「链式代理 (静态出口)」：当前入口节点作为第一跳，流量从配置的 SOCKS5/HTTP 静态 IP 出口出去
          - 链式开启后，「当前节点」显示并切换第一跳入口
          - 系统代理和 TUN 都关闭时，自动暂停内核链式

          ## 使用注意

          1. 先选一个能用的入口节点，再打开链式开关
          2. 打开系统代理或 TUN 后，链式才会接管流量
          3. 关掉系统代理和 TUN 后，链式会暂停；再打开其一会自动恢复

          ## 下载地址

          ### Windows (不再支持Win7)
          #### 正常版本(推荐)
          - [64位(常用)](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_x64-setup.exe) | [ARM64(不常用)](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_arm64-setup.exe)

          #### 内置Webview2版(体积较大，仅在企业版系统或无法安装webview2时使用)
          - [64位](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_x64_fixed_webview2-setup.exe) | [ARM64](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_arm64_fixed_webview2-setup.exe)

          ### macOS
          - [Apple M芯片](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_aarch64.dmg) | [Intel芯片](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_x64.dmg)

          ### Linux
          #### DEB包(Debian系) 使用 apt ./路径 安装
          - [64位](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_amd64.deb) | [ARM64](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_arm64.deb) | [ARMv7](${DOWNLOAD_URL}/Clash.Verge_${VERSION}_armhf.deb)

          #### RPM包(Redhat系) 使用 dnf ./路径 安装
          - [64位](${DOWNLOAD_URL}/Clash.Verge-${VERSION}-1.x86_64.rpm) | [ARM64](${DOWNLOAD_URL}/Clash.Verge-${VERSION}-1.aarch64.rpm) | [ARMv7](${DOWNLOAD_URL}/Clash.Verge-${VERSION}-1.armhfp.rpm)

          ### FAQ
          - [常见问题](https://clash-verge-rev.github.io/faq/windows.html)

          ## 跟上游

          自定义功能在 \`feat/chain-proxy\`。Tag 使用 \`chain-v*\`，不要打官方 \`v2.5.x\`。
          官方最新稳定版见 [clash-verge-rev v2.5.2](https://github.com/clash-verge-rev/clash-verge-rev/releases/tag/v2.5.2)。

          Created at ${BUILDTIME}.
          EOF

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --title "Clash Verge ${TAG} + Static Exit Chain Proxy" \
            --notes-file release.txt
